trigger:
  batch: true
  branches:
    include:
      - legacy

variables:
  - name: ConvertNetCore
    value: false

resources:
  repositories:
    - repository: niveristand-custom-device-build-tools
      type: github
      ref: main
      endpoint: nivs-custom-devices
      name: ni/niveristand-custom-device-build-tools

stages:

# =====================================================================
# WINDOWS BUILD (Stage Template)
# =====================================================================
- template: azure-templates/stages.yml@niveristand-custom-device-build-tools
  parameters:
    stageName: WindowsBuild

    lvVersionsToBuild:
      - version: '2024'
        bitness: '64bit'
      - version: '2025'
        bitness: '64bit'
      - version: '2026'
        bitness: '64bit'

    codegenVis:
      - 'docs\error_codes_files\Copy Errors to Built Directory.vi'

    buildSteps:
      - projectLocation: 'lv-memory-manager\LabVIEW Memory Manager.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Build Source'

      - projectLocation: 'encoding-decoding\Source\Encoding and Decoding.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'SourceDistribution'

      - projectLocation: 'inline-async-api\Source\Project.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'

      - projectLocation: 'advanced-sysdef-api\Source\Advanced System Definition API.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'

      - projectLocation: 'custom-device-serialization\Source\Custom Device Serialization.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'

      - projectLocation: 'error-api\Source\VeriStand Error API.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'

      - projectLocation: 'import-export\Source\VeriStand Custom Device Import Export Tool.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'

      - projectLocation: 'html-help-tools\Source\Compiled HTML Menu Tool\Compile HTML Menu Tool.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'

      - projectLocation: 'hardware-discovery\Source\Hardware Resource Discovery.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'

      - projectLocation: 'network-comm\Source\VeriStand Addon Network Comm.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'

      - projectLocation: 'custom-device-labview-common\Source\Custom Device Common.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'

      - projectLocation: 'runtime-configuration-file-api\Source\Runtime Configuration File API.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'
        exclusions:
          - version: '2024'
            bitness: '64bit'
          - version: '2025'
            bitness: '64bit'

      - projectLocation: 'custom-device-express-framework\Source\Custom Device Interfaces\Custom Device Interfaces.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Build PPL'
        postBuildScript: |
          $src = "$(CD.Workspace)\$(CD.Repository)\custom-device-express-framework\Source\Custom Device Interfaces\Built\Targets\win64\user.lib\Custom Device Interfaces_v1.lvlibp"
          $dest = "C:\Program Files\National Instruments\LabVIEW $(CD.LabVIEW.Version)\user.lib"
          Write-Host "Copying Custom Device Interfaces PPL to LabVIEW user.lib..."
          Copy-Item -Path $src -Destination $dest -Recurse -Force
          Write-Host "Copy complete."
        exclusions:
          - version: '2024'
            bitness: '64bit'
          - version: '2025'
            bitness: '64bit'

      - projectLocation: 'custom-device-express-framework\Source\Custom Device Interfaces\Custom Device Interfaces Linux x64.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'RT PXI Target'
        buildSpec: 'Build PPL'
        postBuildScript: |
          $src = "$(CD.Workspace)\$(CD.Repository)\custom-device-express-framework\Source\Custom Device Interfaces\Built\Targets\NI\RT\Linux\PXI\user.lib\Custom Device Interfaces_v1.lvlibp"
          $dest = "C:\Program Files\National Instruments\LabVIEW $(CD.LabVIEW.Version)\Targets\NI\RT\Linux\PXI\user.lib"
          Write-Host "Copying Linux Custom Device Interfaces PPL to LabVIEW RT user.lib..."
          Copy-Item -Path $src -Destination $dest -Recurse -Force
          Write-Host "Copy complete."
        exclusions:
          - version: '2024'
            bitness: '64bit'
          - version: '2025'
            bitness: '64bit'

      - projectLocation: 'custom-device-express-framework\Source\NIVS Inline Async API (Express)\NIVS Inline Async API (Express).lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'
        exclusions:
          - version: '2024'
            bitness: '64bit'
          - version: '2025'
            bitness: '64bit'

      - projectLocation: 'custom-device-express-framework\Source\NIVS Inline Async API (Express)\NIVS Inline Async API (Express) Linux x64.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'
        exclusions:
          - version: '2024'
            bitness: '64bit'
          - version: '2025'
            bitness: '64bit'

      - projectLocation: 'custom-device-express-framework\Source\Custom Device Test Bench\Custom Device Test Bench.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'
        exclusions:
          - version: '2024'
            bitness: '64bit'
          - version: '2025'
            bitness: '64bit'

      - projectLocation: 'custom-device-express-framework\Source\Custom Device Test Bench\Custom Device Test Bench Linux x64.lvproj'
        buildOperation: 'ExecuteBuildSpec'
        target: 'My Computer'
        buildSpec: 'Move Source'
        exclusions:
          - version: '2024'
            bitness: '64bit'
          - version: '2025'
            bitness: '64bit'

    releaseVersion: '27.0.0'
    buildOutputLocation: 'Built'
    archiveLocation: '\\nirvana\Measurements\VeriStandAddons\legacy\niveristand-custom-device-development-tools'
    repoName: 'niveristand-custom-device-development-tools'

    packages:
      - controlFileName: 'control'
        payloadMaps:
          - installLocation: 'ni-paths-LV$(lvVersion)DIR$(nipkgx64suffix)'
            payloadLocation: 'Common'
          - installLocation: 'ni-paths-LV$(lvVersion)DIR$(nipkgx64suffix)\resource\errors\English'
            payloadLocation: 'Errors'
          - installLocation: 'ni-paths-NISHAREDDIR$(nipkgx64suffix)\LabVIEW Run-Time\$(lvVersion)\errors\English'
            payloadLocation: 'Errors'
          - installLocation: 'ProgramFiles\NI\LVAddons\nivscustomdeviceexpress\1'
            payloadLocation: 'CDInterfaces'

      - controlFileName: 'control_lvmm'
        payloadMaps:
          - installLocation: 'ni-paths-LV$(lvVersion)DIR$(nipkgx64suffix)'
            payloadLocation: 'LVMM'

      - controlFileName: 'control_custom_device_labview_support_common'
        payloadMaps:
          - installLocation: 'ni-paths-LV$(lvVersion)DIR$(nipkgx64suffix)'
            payloadLocation: 'LVCommon'
